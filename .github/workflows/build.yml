# language: YAML, file: .github/workflows/build.yml
name: Build iPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Import signing cert
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
          PROVISION: ${{ secrets.PROVISION_PROFILE }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASS }}
        run: |
          echo "$CERT_P12" | base64 -d > cert.p12
          echo "$PROVISION" | base64 -d > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build archive
        run: |
          xcodebuild -project iPAClient.xcodeproj \
            -scheme iPAClient \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/iPAClient.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="iPA Profile"

      - name: Export ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/iPAClient.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: iPAClient-ipa
          path: build/ipa/*.ipa
